<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSocket Echo 测试页（连接你的 C++ 服务器）</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1f2329; }
  h1 { font-size: 20px; }
  .field { margin: 14px 0; }
  input, textarea { width: 100%; padding: 10px; font-size: 14px;
                    border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; }
  button { padding: 9px 16px; font-size: 14px; border: none; border-radius: 6px;
           cursor: pointer; background: #0969da; color: #fff; margin-right: 8px; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  #status { font-weight: 600; }
  .open { color: #1a7f37; }
  .closed { color: #cf222e; }
  #log { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px;
         padding: 12px; height: 240px; overflow-y: auto; font-family: ui-monospace, monospace;
         font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .hint { color: #57606a; font-size: 13px; }
</style>
</head>
<body>
  <h1>WebSocket Echo 测试页</h1>
  <p class="hint">用于验证你的 C++ 服务器（ws_echo_server）。浏览器会自动完成握手、帧编解码与掩码，你只需观察现象。</p>

  <div class="field">
    <input id="url" value="ws://127.0.0.1:8080" placeholder="ws://127.0.0.1:8080">
  </div>
  <div class="field">
    <button id="btnConnect">连接</button>
    <button id="btnClose" disabled>断开</button>
    <span id="status" class="closed">● 未连接</span>
  </div>

  <div class="field">
    <textarea id="msg" rows="3" placeholder="输入要发送的文本，点「发送文本」"></textarea>
  </div>
  <div class="field">
    <button id="btnSendText">发送文本帧</button>
    <button id="btnPing">发送 Ping（测心跳）</button>
  </div>

  <div class="field" style="border-top:1px solid #e5e7eb;padding-top:12px;">
    <div style="font-size:13px;color:#57606a;margin-bottom:6px;">二进制图传（jpg）— 默认测试文件 0.jpg，也可自选其他 jpg</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input type="file" id="fileInput" accept=".jpg,.jpeg,image/jpeg" style="flex:1;min-width:200px;">
      <button id="btnSendImage" disabled>发送图片帧</button>
    </div>
    <div id="fileInfo" style="font-size:12px;color:#57606a;margin-top:4px;">未选择文件（请点击上方选择项目目录下的 0.jpg）</div>
  </div>

  <div id="log"></div>


  <div id="imageResult" style="display:none;margin-top:12px;">
    <div style="font-size:13px;font-weight:600;margin-bottom:6px;">回显图片</div>
    <img id="echoImage" style="max-width:100%;border:1px solid #d0d7de;border-radius:6px;">
    <div style="margin-top:6px;">
      <a id="downloadLink" download="echo.jpg" style="font-size:12px;color:#0969da;">下载回显图片</a>
    </div>
  </div>

  

<script>
  const log = document.getElementById('log');
  const statusEl = document.getElementById('status');
  let ws = null;

  function println(s) {
    const line = document.createElement('div');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${s}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function setStatus(open) {
    if (open) {
      statusEl.textContent = '● 已连接';
      statusEl.className = 'open';
      document.getElementById('btnConnect').disabled = true;
      document.getElementById('btnClose').disabled = false;
    } else {
      statusEl.textContent = '● 未连接';
      statusEl.className = 'closed';
      document.getElementById('btnConnect').disabled = false;
      document.getElementById('btnClose').disabled = true;
    }
  }

  document.getElementById('btnConnect').onclick = () => {
    ws = new WebSocket(document.getElementById('url').value);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      setStatus(true);
      println('✅ 连接建立（服务器已完成 101 握手）');
    };
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        println('⬅ 收到文本帧回显: ' + e.data);
      } else {
        const bytes = new Uint8Array(e.data);
        println('⬅ 收到二进制帧回显: ' + bytes.length + ' 字节');
        // 渲染为 jpg 图片
        const blob = new Blob([e.data], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const img = document.getElementById('echoImage');
        img.src = url;
        document.getElementById('imageResult').style.display = 'block';
        document.getElementById('downloadLink').href = url;
        // 校验 jpg 文件头 FF D8 FF
        if (bytes.length >= 3 && bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) {
          println('✅ 回显数据为有效 jpg 格式（文件头 FF D8 FF）');
        } else {
          println('⚠️ 回显数据不是标准 jpg 格式（文件头不匹配）');
        }
      }
    };
    ws.onclose = (e) => {
      setStatus(false);
      println(`🔌 连接关闭 code=${e.code}`);
    };
    ws.onerror = () => println('⚠️ 连接错误');
  };

  document.getElementById('btnClose').onclick = () => ws && ws.close();

  document.getElementById('btnSendText').onclick = () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) { println('⚠️ 请先连接'); return; }
    const t = document.getElementById('msg').value || 'hello websocket';
    ws.send(t);
    println('➡ 已发送文本帧: ' + t);
  };

  // ---- 二进制图传：选择 jpg 文件并发送 ----
  const fileInput = document.getElementById('fileInput');
  const btnSendImage = document.getElementById('btnSendImage');
  const fileInfo = document.getElementById('fileInfo');
  let selectedFile = null;

  fileInput.onchange = () => {
    if (fileInput.files && fileInput.files[0]) {
      selectedFile = fileInput.files[0];
      fileInfo.textContent = '已选择: ' + selectedFile.name + ' (' + selectedFile.size + ' 字节)';
      btnSendImage.disabled = false;
    } else {
      selectedFile = null;
      fileInfo.textContent = '未选择文件（请点击上方选择项目目录下的 0.jpg）';
      btnSendImage.disabled = true;
    }
  };

  btnSendImage.onclick = () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) { println('⚠️ 请先连接'); return; }
    if (!selectedFile) { println('⚠️ 请先选择 jpg 文件'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      ws.send(reader.result); // ArrayBuffer，浏览器自动作为二进制帧发送（带 mask）
      println('➡ 已发送图片帧: ' + selectedFile.name + ' (' + selectedFile.size + ' 字节)');
    };
    reader.onerror = () => println('⚠️ 文件读取失败');
    reader.readAsArrayBuffer(selectedFile);
  };

  document.getElementById('btnPing').onclick = () => {
    // 浏览器原生 API 不暴露手动 ping，这里用空文本模拟说明
    // 实际上 Chrome 会自动发送 ping/pong 维持连接，服务器端会打印日志
    println('ℹ️ 浏览器会自动处理 Ping/Pong 心跳（服务器端日志会显示 [recv] PING）');
  };
</script>
</body>
</html>
